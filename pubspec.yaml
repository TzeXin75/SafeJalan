name: safejalan_native
description: SafeJalan built with native Flutter widgets following BMIT2073 practical methods.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  image_picker: ^1.2.0
  google_mlkit_image_labeling: ^0.16.1
  geocoding: ^4.0.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  location: ^8.0.1
  permission_handler: ^12.0.3
  connectivity_plus: ^6.1.5
  intl: ^0.20.2
  supabase_flutter: ^2.17.2
  uuid: ^4.6.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/safejalan_logo.png
    - assets/images/safejalan_app_icon.png
